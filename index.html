<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZEKO Finapp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;background:#F0F4F8;color:#1A202C;min-height:100vh;-webkit-tap-highlight-color:transparent}

/* LOGIN SCREEN */
#login-screen{position:fixed;inset:0;background:linear-gradient(145deg,#1E3A5F 0%,#0d1830 100%);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
#login-screen.hidden{display:none}
#login-box{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:36px 32px;max-width:360px;width:100%;text-align:center;backdrop-filter:blur(10px)}
.login-logo{width:64px;height:64px;margin:0 auto 16px;display:block;border-radius:14px}
#login-box h2{font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:4px}
#login-box .login-sub{font-size:.8rem;color:rgba(255,255,255,.5);margin-bottom:24px}
.login-inp{width:100%;padding:12px 16px;border:1.5px solid rgba(255,255,255,.15);border-radius:10px;font-size:.9rem;outline:none;background:rgba(255,255,255,.08);color:#fff;margin-bottom:10px;transition:border-color .2s}
.login-inp::placeholder{color:rgba(255,255,255,.35)}
.login-inp:focus{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.12)}
#login-err{color:#FCA5A5;font-size:.75rem;min-height:16px;margin-bottom:8px}
#login-btn{width:100%;padding:13px;background:#2563EB;color:#fff;border:none;border-radius:10px;font-size:.92rem;font-weight:700;cursor:pointer;transition:background .15s;margin-bottom:10px}
#login-btn:hover,#login-btn:active{background:#1D4ED8}
#toggle-signup{background:none;border:none;color:rgba(255,255,255,.45);font-size:.75rem;cursor:pointer;padding:4px;text-decoration:underline}
#toggle-signup:hover{color:rgba(255,255,255,.7)}
.sync-dot{font-size:.85rem;line-height:1;cursor:default;margin-right:2px}
button{cursor:pointer;font-family:inherit;-webkit-appearance:none}
input,select{font-family:inherit;-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* HEADER */
.app-header{background:linear-gradient(135deg,#1E3A5F 0%,#2D5A8E 100%);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25);position:sticky;top:0;z-index:200;gap:12px}
.header-left h1{font-size:1.1rem;font-weight:700;letter-spacing:-.2px}
.header-left p{font-size:.7rem;opacity:.7;margin-top:1px}
.header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}

/* BUTTONS */
.btn{padding:8px 14px;border-radius:8px;border:none;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;min-height:36px}
.btn-outline{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-outline:hover,.btn-outline:active{background:rgba(255,255,255,.28)}
.btn-primary{background:#2563EB;color:#fff}
.btn-primary:hover,.btn-primary:active{background:#1D4ED8}
.btn-ghost{background:transparent;color:#64748B;border:1.5px solid #E2E8F0}
.btn-ghost:hover,.btn-ghost:active{background:#F1F5F9}
.btn-sm{padding:5px 10px;font-size:.72rem;min-height:28px;border-radius:6px}
.btn-cat-add{background:rgba(255,255,255,.18);color:#fff;border:1.5px dashed rgba(255,255,255,.5);font-size:.72rem;padding:3px 10px;border-radius:6px;min-height:26px;cursor:pointer;font-weight:600}
.btn-cat-add:hover{background:rgba(255,255,255,.28)}

/* TABS */
.tab-nav{background:#fff;padding:0 20px;display:flex;border-bottom:2px solid #E2E8F0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;box-shadow:0 1px 4px rgba(0,0,0,.06);position:sticky;top:53px;z-index:100}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:13px 18px;border:none;background:none;font-size:.82rem;font-weight:600;color:#64748B;cursor:pointer;position:relative;transition:color .15s;white-space:nowrap;flex-shrink:0}
.tab-btn:hover{color:#2563EB}
.tab-btn.active{color:#2563EB}
.tab-btn.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2.5px;background:#2563EB;border-radius:2px 2px 0 0}

/* LAYOUT */
.tab-content{display:none;padding:20px 20px 60px}
.tab-content.active{display:block}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #F1F5F9;gap:10px}
.card-title{font-size:.9rem;font-weight:700;color:#1E293B}

/* TABLE */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-wrap::-webkit-scrollbar{height:5px}
.table-wrap::-webkit-scrollbar-track{background:#F1F5F9}
.table-wrap::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.ftable{width:100%;border-collapse:collapse;min-width:800px}
.ftable th,.ftable td{padding:0;border:none}
.col-lbl{min-width:190px;width:190px;position:sticky;left:0;z-index:10;background:#fff}
.col-mo{min-width:90px;width:90px;text-align:right}

/* Table header */
.tr-head th{background:#1E3A5F;color:#fff;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:10px;white-space:nowrap;position:sticky;top:0}
.tr-head .col-lbl{background:#1E3A5F;z-index:20;top:0}

/* Section header */
.tr-sec .col-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#fff;display:flex;align-items:center;gap:6px}

/* Item rows */
.tr-item td{border-bottom:1px solid #F8FAFC}
.tr-item .col-lbl{padding:0 8px 0 20px;display:flex;align-items:center;gap:6px;background:#fff;min-height:38px}
.item-name-inp{border:none;outline:none;background:transparent;font-size:.78rem;color:#374151;flex:1;min-width:0;padding:0}
.item-name-inp:focus{color:#1E3A5F}
.tr-item:hover .col-lbl{background:#FAFCFF}

/* Cell with sub-entries button */
.cell-td{padding:0;position:relative}
.cell-inner{display:flex;align-items:center;position:relative}
.cell-inp{
  flex:1;border:none;outline:none;text-align:right;
  padding:9px 6px 9px 6px;font-size:.78rem;background:transparent;color:#374151;
  min-width:0;transition:background .1s;width:100%;
}
.cell-inp:focus{background:#EFF6FF;color:#1E3A5F}
.cell-inp.neg{color:#DC2626}
.cell-inp.pos{color:#059669}
.cell-inp.recur-val{color:#93C5FD;font-style:italic}
.cell-inp[readonly]{cursor:default}

/* Sub-entries toggle button */
.cell-sub-btn{
  flex-shrink:0;width:20px;height:100%;min-height:36px;
  background:none;border:none;cursor:pointer;
  font-size:10px;color:#CBD5E1;
  display:flex;align-items:center;justify-content:center;
  padding:0 4px 0 0;
  opacity:0;transition:opacity .15s;
}
.cell-sub-btn.has-subs{opacity:1;color:#2563EB}
.tr-item:hover .cell-sub-btn{opacity:1}
@media(hover:none){.cell-sub-btn{opacity:1!important}}

/* Recurring badge on item label */
.recur-badge{
  font-size:.62rem;background:#DBEAFE;color:#1D4ED8;
  border-radius:4px;padding:1px 5px;font-weight:700;flex-shrink:0;cursor:pointer;
}
.recur-badge:hover{background:#BFDBFE}

.btn-del{background:none;border:none;color:#CBD5E1;font-size:13px;cursor:pointer;padding:4px 4px;border-radius:5px;flex-shrink:0;min-width:22px;min-height:22px;display:flex;align-items:center;justify-content:center}
.btn-del:hover,.btn-del:active{color:#EF4444;background:#FEF2F2}
@media(hover:none){.btn-del{opacity:1!important;color:#D1D5DB}}

/* Subtotal row */
.tr-subtt td{background:#F8FAFC;padding:7px 10px;font-size:.75rem;font-weight:700;color:#475569;border-bottom:2px solid #E2E8F0}
.tr-subtt .col-lbl{background:#F8FAFC;font-style:italic;padding-left:22px}

/* Summary rows */
.tr-mut td,.tr-sal td,.tr-liq td{padding:10px;font-size:.78rem;font-weight:600}
.tr-mut td{background:#DBEAFE;color:#1E3A5F}
.tr-mut .col-lbl{background:#DBEAFE}
.tr-sal td{background:#EFF6FF;color:#1E3A5F}
.tr-sal .col-lbl{background:#EFF6FF}
.tr-liq td{background:#1E3A5F;color:#fff;font-size:.85rem;font-weight:700}
.tr-liq .col-lbl{background:#1E3A5F}
.tr-liq .liq-pos{color:#6EE7B7}
.tr-liq .liq-neg{color:#FCA5A5}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Color dot */
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-left:2px;cursor:pointer;transition:transform .15s}
.cdot:hover{transform:scale(1.5)}
.cdot-lg{display:inline-block;width:13px;height:13px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid rgba(255,255,255,.6);transition:transform .15s}
.cdot-lg:hover{transform:scale(1.3)}

/* Bank accounts */
.bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bank-item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#F8FAFC;border-radius:10px;border:1px solid #E8EEF4}
.bank-item-name{flex:1;min-width:0}
.bank-name-inp{width:100%;background:transparent;border:none;outline:none;font-size:.78rem;color:#374151}
.bank-val-inp{width:85px;text-align:right;background:transparent;border:none;outline:none;font-size:.82rem;font-weight:600;color:#1E3A5F;border-bottom:1.5px dashed #CBD5E1;padding-bottom:1px}
.bank-total{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#1E3A5F;color:#fff;border-radius:10px;margin-top:10px;font-weight:700;font-size:.85rem}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-card{background:#fff;border-radius:14px;box-shadow:0 1px 5px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);padding:18px}
.chart-card-wide{grid-column:1/-1}
.chart-title{font-size:.85rem;font-weight:700;color:#1E293B;margin-bottom:14px}
.chart-wrap{position:relative;height:220px}
.chart-wrap-lg{height:260px}

/* Investments */
.inv-charts-row{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}
.inv-note-inp{
  width:100%;border:none;outline:none;background:transparent;
  font-size:.72rem;color:#64748B;font-style:italic;
  border-bottom:1px dashed transparent;padding:2px 4px;
}
.inv-note-inp:focus{border-bottom-color:#94A3B8;background:#F8FAFC;color:#374151}
.inv-note-inp::placeholder{color:#CBD5E1}
.col-note{min-width:130px;width:130px;text-align:left;padding:0 8px}

/* ===== SUB-ENTRIES PANEL ===== */
#subs-backdrop{display:none;position:fixed;inset:0;z-index:490;background:rgba(0,0,0,.15);backdrop-filter:blur(1px)}
#subs-panel{
  display:none;position:fixed;z-index:500;
  background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.2);
  overflow:hidden;
}
.sp-header{
  background:#1E3A5F;color:#fff;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;
}
.sp-title{font-size:.85rem;font-weight:700;line-height:1.3}
.sp-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sp-list{max-height:240px;overflow-y:auto;padding:8px 0}
.sp-entry{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid #F8FAFC}
.sp-entry-date{font-size:.72rem;color:#94A3B8;min-width:58px}
.sp-entry-desc{flex:1;font-size:.78rem;color:#374151;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-entry-amount{font-size:.78rem;font-weight:600;min-width:65px;text-align:right}
.sp-entry-amount.neg{color:#DC2626}
.sp-entry-amount.pos{color:#059669}
.sp-del{background:none;border:none;color:#E2E8F0;font-size:13px;cursor:pointer;padding:2px 4px;border-radius:4px;flex-shrink:0}
.sp-del:hover{color:#EF4444;background:#FEF2F2}
.sp-add-row{
  display:grid;
  grid-template-columns:90px 1fr 80px 32px;
  gap:6px;padding:10px 14px;background:#F8FAFC;border-top:1px solid #E2E8F0;
}
.sp-add-row input{
  border:1.5px solid #E2E8F0;border-radius:7px;padding:6px 8px;
  font-size:.78rem;outline:none;color:#374151;background:#fff;width:100%;
}
.sp-add-row input:focus{border-color:#2563EB}
.sp-add-row input[type=number]{text-align:right}
.sp-add-btn{
  background:#2563EB;color:#fff;border:none;border-radius:7px;
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.sp-add-btn:hover{background:#1D4ED8}
.sp-footer{
  padding:11px 16px;display:flex;justify-content:space-between;align-items:center;
  background:#EFF6FF;border-top:1px solid #DBEAFE;
}
.sp-footer-label{font-size:.75rem;color:#64748B;font-weight:600}
.sp-total{font-size:.95rem;font-weight:700;color:#1E3A5F}
.sp-empty{padding:20px;text-align:center;color:#94A3B8;font-size:.8rem}

/* ===== MODAL (Add / Color / Recurring) ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:1000;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:460px;box-shadow:0 -4px 30px rgba(0,0,0,.2);animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-handle{width:36px;height:4px;background:#E2E8F0;border-radius:2px;margin:0 auto 18px}
.modal h3{font-size:.95rem;font-weight:700;margin-bottom:16px;color:#1E293B}
.modal label{display:block;font-size:.75rem;color:#64748B;margin-bottom:5px;margin-top:14px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.modal input[type=text],.modal input[type=number]{width:100%;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:.9rem;outline:none;transition:border-color .15s;color:#1E293B}
.modal input[type=text]:focus,.modal input[type=number]:focus{border-color:#2563EB}
.modal select{width:100%;padding:10px 14px;border:1.5px solid #E2E8F0;border-radius:10px;font-size:.9rem;outline:none;color:#1E293B;background:#fff;cursor:pointer}
.modal select:focus{border-color:#2563EB}
.color-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.col-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s}
.col-opt:hover{transform:scale(1.15)}
.col-opt.sel{border-color:#fff;box-shadow:0 0 0 2.5px #2563EB}
.modal-actions{display:flex;gap:8px;margin-top:20px}
.modal-actions .btn{flex:1;justify-content:center}

/* Recurring toggle */
.recur-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F1F5F9}
.recur-toggle-label{font-size:.85rem;font-weight:600;color:#374151}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#CBD5E1;border-radius:24px;transition:.3s}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:#2563EB}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
.recur-info{font-size:.72rem;color:#94A3B8;margin-top:12px;line-height:1.5}

/* Print */
@media print{
  .app-header .header-actions,.tab-nav,.btn-del,.btn-cat-add,.no-print,.tab-content:not(.active){display:none!important}
  .tab-content.active{padding:0}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #E2E8F0;margin-bottom:12px}
  .col-lbl{position:static}
  .tr-head .col-lbl{position:static}
  .cell-sub-btn{display:none!important}
  @page{margin:12mm;size:A4 landscape}
}

/* Responsive */
@media(max-width:640px){
  .app-header{padding:13px 16px}
  .tab-content{padding:14px 14px 70px}
  .charts-grid{grid-template-columns:1fr}
  .charts-grid .chart-card-wide{grid-column:1}
  .inv-charts-row{grid-template-columns:1fr}
  .bank-grid{grid-template-columns:1fr}
  .header-left h1{font-size:1rem}
  .col-lbl{min-width:160px;width:160px}
  .col-mo{min-width:82px;width:82px}
  .btn{padding:7px 11px;font-size:.74rem}
  #subs-panel{border-radius:20px 20px 0 0!important}
}

/* Misc */
.tip{font-size:.72rem;color:#94A3B8;padding:10px 0 0;line-height:1.5}
.pos-text{color:#059669}
.neg-text{color:#DC2626}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div id="login-box">
    <svg class="login-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="lb-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e2f58"/><stop offset="100%" stop-color="#0d1830"/></linearGradient><linearGradient id="lb-lt" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#f5ede0"/><stop offset="100%" stop-color="#d4c3a5"/></linearGradient></defs><rect width="512" height="512" rx="108" ry="108" fill="url(#lb-bg)"/><rect x="82" y="148" width="152" height="26" rx="5" fill="url(#lb-lt)"/><polygon points="234,174 82,338 82,364 108,364 234,200" fill="url(#lb-lt)"/><rect x="82" y="338" width="152" height="26" rx="5" fill="url(#lb-lt)"/><rect x="278" y="148" width="26" height="216" rx="5" fill="url(#lb-lt)"/><polygon points="304,250 430,148 400,148 278,235 278,265 304,265" fill="url(#lb-lt)"/><polygon points="304,265 278,265 278,290 400,364 430,364" fill="url(#lb-lt)"/></svg>
    <h2>ZEKO Finapp</h2>
    <p class="login-sub" id="login-sub">Inloggen met uw e-mailadres</p>
    <input class="login-inp" type="email" id="login-email" placeholder="E-mailadres" autocomplete="email">
    <input class="login-inp" type="password" id="login-pw" placeholder="Wachtwoord" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-err"></div>
    <button id="login-btn" onclick="doLogin()">Inloggen</button>
    <button id="toggle-signup" onclick="toggleSignup()">Nog geen account? Aanmelden</button>
  </div>
</div>

<header class="app-header">
  <div class="header-left">
    <h1>ZEKO Finapp</h1>
    <p>Liquiditeitsprognose &amp; Beleggingen</p>
  </div>
  <div class="header-actions">
    <span id="sync-dot" class="sync-dot no-print" title="Synchronisatiestatus">☁️</span>
    <button class="btn btn-outline" onclick="exportData()">💾 Opslaan</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importFile(event)">
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📂 Laden</button>
    <button class="btn btn-outline no-print" onclick="window.print()">🖨</button>
    <button class="btn btn-outline no-print" onclick="doLogout()" title="Uitloggen">🚪</button>
  </div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="showTab('prognose',this)">Liquiditeitsprognose</button>
  <button class="tab-btn" onclick="showTab('grafieken',this)">📈 Grafieken</button>
  <button class="tab-btn" onclick="showTab('beleggingen',this)">💼 Beleggingen</button>
</nav>

<div id="tab-prognose" class="tab-content active"></div>
<div id="tab-grafieken" class="tab-content"></div>
<div id="tab-beleggingen" class="tab-content"></div>

<!-- Sub-entries backdrop + panel -->
<div id="subs-backdrop" onclick="closeSubsPanel()"></div>
<div id="subs-panel">
  <div class="sp-header">
    <div class="sp-title" id="sp-title">Boodschappen — Jul '26</div>
    <button class="sp-close" onclick="closeSubsPanel()">×</button>
  </div>
  <div id="sp-list"></div>
  <div class="sp-add-row">
    <input type="date" id="sp-date">

<script>
// ================================================
// CONSTANTS
// ================================================
const MONTHS = [
  {k:'2026-07',l:"Jul '26"},{k:'2026-08',l:"Aug '26"},
  {k:'2026-09',l:"Sep '26"},{k:'2026-10',l:"Okt '26"},
  {k:'2026-11',l:"Nov '26"},{k:'2026-12',l:"Dec '26"},
  {k:'2027-01',l:"Jan '27"},{k:'2027-02',l:"Feb '27"},

  {k:'2027-05',l:"Mei '27"},{k:'2027-06',l:"Jun '27"},
  {k:'2027-07',l:"Jul '27"},{k:'2027-08',l:"Aug '27"},
];
const NM = MONTHS.length;

const COLORS = [
  '#3B82F6','#10B981','#F97316','#8B5CF6','#EF4444',
  '#EC4899','#06B6D4','#84CC16','#F59E0B','#6366F1',
  '#14B8A6','#F43F5E','#A855F7','#22C55E','#0EA5E9',
  '#D97706','#7C3AED','#059669','#DC2626','#2563EB',
];

let _id = 300;
const uid = () => 'x' + (_id++);
function zeros(n=NM){ return Array(n).fill(0); }
function newSubs(n=NM){ return Array(n).fill(null).map(()=>[]); }
function prefill(v,n=NM,c=2){ return Array(n).fill(0).map((_,i)=>i<c?v:0); }

// ================================================
// DEFAULT RECURRING OBJECT
// ================================================
function mkRecur(){ return {on:false,freq:'monthly',value:0}; }

// ================================================
// STATE
// ================================================
let S = {

    {id:'b3',name:'Bankrekening 3',val:0},

    {id:'b5',name:'Spaarrekening 2',val:2750},
  ],
  income:[
    {id:'i1',name:'Loon',v:prefill(5000),subs:newSubs(),recur:mkRecur()},

  ],
  cats:[
    {id:'c1',name:'Wonen',color:'#3B82F6',items:[
      {id:'e1',name:'Hypotheek',v:prefill(-1000),subs:newSubs(),recur:{on:true,freq:'monthly',value:-1000}},

    ]},
    {id:'c2',name:'Levensonderhoud',color:'#F97316',items:[
      {id:'e7',name:'Boodschappen',v:prefill(-500),subs:newSubs(),recur:{on:true,freq:'monthly',value:-500}},
      {id:'e8',name:'Reiskosten',v:prefill(-150),subs:newSubs(),recur:mkRecur()},
    ]},
    {id:'c3',name:'Variabel',color:'#8B5CF6',items:[
      {id:'e9',name:'Onvoorzien',v:prefill(-100),subs:newSubs(),recur:mkRecur()},

  ],
  inv:{
    types:[
      {id:'inv1',name:"Aandelen / ETF's",color:'#3B82F6',items:[{id:'ia1',name:'Voorbeeld: VWCE',note:'',v:zeros()}]},
      {id:'inv2',name:'Vastgoed',color:'#F97316',items:[{id:'ia2',name:'Eigen woning',note:'',v:zeros()}]},
      {id:'inv3',name:'Spaargeld',color:'#10B981',items:[{id:'ia3',name:'Spaarrekening',note:'',v:zeros()}]},
      {id:'inv4',name:'Pensioen',color:'#8B5CF6',items:[{id:'ia4',name:'Pensioenopbouw',note:'',v:zeros()}]},
      {id:'inv5',name:'Crypto',color:'#EF4444',items:[{id:'ia5',name:'Bitcoin',note:'',v:zeros()}]},
    ]
  }
};

// ================================================
// MIGRATE: ensure all items have required fields
// ================================================
function migrate(state) {
  const ensureItem = it => {
    if (!it.subs || !Array.isArray(it.subs) || it.subs.length !== NM) it.subs = newSubs();
    it.subs = it.subs.map(s => (Array.isArray(s) ? s : []));
    if (!it.recur || typeof it.recur !== 'object') it.recur = mkRecur();
  };
  (state.income || []).forEach(ensureItem);
  (state.cats || []).forEach(c => (c.items || []).forEach(ensureItem));
  (state.inv?.types || []).forEach(t => (t.items || []).forEach(it => {
    if (it.note === undefined) it.note = '';
    if (!it.v || it.v.length !== NM) it.v = zeros();
  }));
  return state;
}

// ================================================
// VALUE CALCULATION (priority: subs > direct > recurring)
// ================================================
function monthMatchesFreq(mi, freq) {
  if (freq === 'monthly') return true;
  if (freq === 'quarterly') return mi % 3 === 0;        // Jul, Okt, Jan, Apr, Jul
  if (freq === 'yearly') return mi === 0 || mi === 12;  // Jul '26 and Jul '27
  return false;
}

function getVal(item, mi) {
  // 1. Sub-entries take priority
  const subs = item.subs && item.subs[mi];
  if (subs && subs.length > 0) {
    return subs.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  }
  // 2. Direct input
  const direct = parseFloat(item.v[mi]) || 0;
  if (direct !== 0) return direct;
  // 3. Recurring default
  if (item.recur && item.recur.on && monthMatchesFreq(mi, item.recur.freq)) {
    return parseFloat(item.recur.value) || 0;
  }
  return 0;
}

// ================================================
// CALCULATIONS (formules identiek aan Excel)
// ================================================
function initBal(){ return S.bank.reduce((s,a)=>s+(parseFloat(a.val)||0),0); }
function mutaties(mi){
  let t=0;
  S.income.forEach(it=>t+=getVal(it,mi));
  S.cats.forEach(c=>c.items.forEach(it=>t+=getVal(it,mi)));
  return t;
}
function saldo(mi){ return mi===0?initBal():liquiditeit(mi-1); }
function liquiditeit(mi){ return mutaties(mi)+saldo(mi); }

function invTypeTotal(type,mi){ return type.items.reduce((s,it)=>s+(parseFloat(it.v[mi])||0),0); }
function invGrandTotal(mi){ return S.inv.types.reduce((s,t)=>s+invTypeTotal(t,mi),0); }

// ================================================
// FORMATTING
// ================================================
const fmtEur = new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0});
function fmt(v){ const n=parseFloat(v)||0; return n===0?'—':fmtEur.format(n); }
function fmtSign(v){ const n=parseFloat(v)||0; return n>0?'pos-text':n<0?'neg-text':''; }
function inputCls(v){ const n=parseFloat(v)||0; return n>0?'pos':n<0?'neg':''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ================================================
// RENDER: PROGNOSE
// ================================================
function renderPrognose(){
  const mo_th = MONTHS.map(m=>`<th class="col-mo">${m.l}</th>`).join('');
  const empties = MONTHS.map(()=>'<td class="col-mo"></td>').join('');

  const incRows = S.income.map(it=>itemRow(it,'inc',null,'#059669')).join('');

    const items = cat.items.map(it=>itemRow(it,'cat',cat.id,cat.color)).join('');
    return `

        <td class="col-lbl" style="background:${cat.color};display:flex;align-items:center;justify-content:space-between;gap:6px">
          <span style="display:flex;align-items:center;gap:8px">
            <span class="cdot-lg" style="background:${cat.color};border-color:rgba(255,255,255,.7)" onclick="editColor('cat','${cat.id}')" title="Kleur aanpassen"></span>
            <span style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#fff">${esc(cat.name)}</span>
          </span>
          <span style="display:flex;gap:5px;align-items:center;flex-shrink:0">

  const bankRows = S.bank.map(a=>`
    <div class="bank-item">
      <div class="bank-item-name"><input class="bank-name-inp" type="text" value="${esc(a.name)}" onchange="S.bank.find(x=>x.id==='${a.id}').name=this.value;saveToStorage()"></div>
      <input class="bank-val-inp" type="number" value="${a.val||''}" placeholder="0" onchange="updBank('${a.id}',this.value)">
      <button class="btn-del" onclick="delBank('${a.id}')">✕</button>
    </div>`).join('');

  document.getElementById('tab-prognose').innerHTML = `
    <div class="card">
      <div class="card-header">
        <span class="card-title">Liquiditeitsprognose — Jul 2026 t/m Aug 2027</span>
        <button class="btn btn-ghost btn-sm no-print" onclick="openAddModal('cat')">+ Categorie</button>
      </div>
      <div class="table-wrap">
        <table class="ftable">
          <thead><tr class="tr-head"><th class="col-lbl">Omschrijving</th>${mo_th}</tr></thead>
          <tbody>
            <tr class="tr-sec" style="background:#059669">
              <td class="col-lbl" style="background:#059669;display:flex;align-items:center;justify-content:space-between">
                <span style="font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#fff">Inkomsten</span>
                <button class="btn-cat-add no-print" onclick="addIncome()">+ Item</button>
              </td>${empties}
            </tr>
            ${incRows}${catSections}
            <tr class="tr-mut"><td class="col-lbl">Mutaties per maand</td>${mutRow}</tr>
            <tr class="tr-sal"><td class="col-lbl">Saldo bank (begin maand)</td>${salRow}</tr>
            <tr class="tr-liq"><td class="col-lbl">💰 Liquiditeit per maand</td>${liqRow}</tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Beginsaldo bankrekeningen</span>
        <button class="btn btn-ghost btn-sm no-print" onclick="addBank()">+ Rekening</button>
      </div>
      <div style="padding:16px">
        <p style="font-size:.74rem;color:#64748B;margin-bottom:12px">Totale saldo van al uw rekeningen op 1 juli 2026 — het startpunt van de prognose.</p>
        <div class="bank-grid">${bankRows}</div>
        <div class="bank-total"><span>Totaal beginsaldo</span><span id="bank-total">${fmt(initBal())}</span></div>
      </div>
    </div>
    <p class="tip no-print">💡 Tik op een cel om een bedrag in te vullen. Gebruik de <strong>🧾</strong> knop om meerdere bonnen per cel toe te voegen. Gebruik <strong>🔁</strong> om een terugkerend bedrag in te stellen. Tik op de gekleurde stip om een kleur te wijzigen.</p>`;
}

// ================================================
// ITEM ROW (with sub-entries button + recurring badge)
// ================================================
function itemRow(item, type, catId, color){
  // Recurring badge
  const rBadge = item.recur && item.recur.on
    ? `<span class="recur-badge" onclick="openRecurModal('${item.id}','${type}','${catId||''}')" title="Terugkerend bedrag aanpassen">🔁 ${freqLabel(item.recur.freq)}</span>`
    : `<span class="recur-badge" style="background:#F1F5F9;color:#94A3B8" onclick="openRecurModal('${item.id}','${type}','${catId||''}')" title="Terugkerend bedrag instellen">🔁</span>`;

  const cells = MONTHS.map((_,mi) => {
    const subs = item.subs && item.subs[mi] ? item.subs[mi] : [];
    const hasSubs = subs.length > 0;
    const directVal = parseFloat(item.v[mi]) || 0;
    const recurApplies = item.recur && item.recur.on && monthMatchesFreq(mi, item.recur.freq);
    const effectiveVal = getVal(item, mi);

    // Input display value and class
    let dispVal = '', dispCls = '';
    if (hasSubs) {
      dispVal = effectiveVal;
      dispCls = effectiveVal < 0 ? 'neg' : effectiveVal > 0 ? 'pos' : '';
    } else if (directVal !== 0) {
      dispVal = directVal;
      dispCls = directVal < 0 ? 'neg' : directVal > 0 ? 'pos' : '';
    } else if (recurApplies) {
      dispVal = item.recur.value;
      dispCls = 'recur-val';
    }

    const subBtnCls = hasSubs ? 'cell-sub-btn has-subs' : 'cell-sub-btn';
    const subBtnTitle = hasSubs ? `${subs.length} bon(nen) — klik om te bekijken` : 'Bon toevoegen';
    const subBtnIcon = hasSubs ? `🧾` : `+`;

    return `<td class="col-mo cell-td">
      <div class="cell-inner">
        <input type="number" class="cell-inp ${dispCls}"
          value="${dispVal !== '' && dispVal !== 0 ? dispVal : ''}"
          placeholder="${(!hasSubs && !directVal && recurApplies) ? item.recur.value : ''}"
          ${hasSubs ? 'readonly' : ''}
          step="any"
          onchange="updVal('${item.id}','${type}','${catId||''}',${mi},this.value)"
          oninput="if(!this.readOnly){const n=parseFloat(this.value)||0;this.className='cell-inp '+(n<0?'neg':n>0?'pos':'')}">
        <button class="${subBtnCls}" title="${subBtnTitle}"
          onclick="openSubsPanel('${item.id}','${type}','${catId||''}',${mi},event)">${subBtnIcon}</button>
      </div>
    </td>`;
  }).join('');

  const del = `<button class="btn-del no-print" onclick="delItem('${item.id}','${type}','${catId||''}')">✕</button>`;
  return `<tr class="tr-item" data-id="${item.id}">
    <td class="col-lbl">
      <span class="cdot" style="background:${color}"></span>
      <input class="item-name-inp" type="text" value="${esc(item.name)}"
        onchange="updName('${item.id}','${type}','${catId||''}',this.value)">
      ${rBadge}
      ${del}
    </td>${cells}
  </tr>`;
}

function freqLabel(f){ return f==='monthly'?'M':f==='quarterly'?'Q':'J'; }

// ================================================
// SUB-ENTRIES PANEL
// ================================================
let _sp = {itemId:null,type:null,catId:null,mi:null};

function openSubsPanel(itemId, type, catId, mi, event){
  event.stopPropagation();
  _sp = {itemId, type, catId, mi};
  const item = findItemFull(itemId, type, catId);
  if (!item) return;
  if (!item.subs) item.subs = newSubs();
  if (!item.subs[mi]) item.subs[mi] = [];

  document.getElementById('sp-title').textContent = `${item.name} — ${MONTHS[mi].l}`;
  document.getElementById('sp-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('sp-desc').value = '';
  document.getElementById('sp-amount').value = '';

  renderSubsList(item.subs[mi]);

  const panel = document.getElementById('subs-panel');
  const backdrop = document.getElementById('subs-backdrop');
  const isMobile = window.innerWidth < 640;

  if (isMobile) {
    panel.style.cssText = 'display:block;position:fixed;bottom:0;left:0;right:0;top:auto;z-index:500;border-radius:20px 20px 0 0;max-height:80vh;overflow-y:auto';
  } else {
    const btn = event.currentTarget || event.target;
    const rect = btn.getBoundingClientRect();
    const pw = 340, ph = 400;
    let x = rect.left - pw + rect.width;
    let y = rect.bottom + 6;
    if (x < 8) x = 8;
    if (y + ph > window.innerHeight - 8) y = rect.top - ph - 6;
    panel.style.cssText = `display:block;position:fixed;left:${x}px;top:${y}px;width:${pw}px;max-height:${ph}px;overflow-y:auto;z-index:500;border-radius:14px`;
  }
  backdrop.style.display = 'block';
  setTimeout(()=>document.getElementById('sp-amount').focus(), 100);
}

function closeSubsPanel(){
  document.getElementById('subs-panel').style.display = 'none';
  document.getElementById('subs-backdrop').style.display = 'none';
  updateCalc();
  saveToStorage();
}

function renderSubsList(subs){
  const list = document.getElementById('sp-list');
  if (!subs || subs.length === 0) {
    list.innerHTML = `<div class="sp-empty">Nog geen bonnen. Voeg hieronder uw eerste bedrag toe.</div>`;
    document.getElementById('sp-total').textContent = '—';
    return;
  }
  const total = subs.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  list.innerHTML = subs.map(e => {
    const amt = parseFloat(e.amount)||0;
    const amtCls = amt < 0 ? 'neg' : amt > 0 ? 'pos' : '';
    return `<div class="sp-entry">
      <span class="sp-entry-date">${e.date||''}</span>
      <span class="sp-entry-desc">${esc(e.desc||'—')}</span>
      <span class="sp-entry-amount ${amtCls}">${fmt(amt)}</span>
      <button class="sp-del" onclick="delSubEntry('${e.id}')">✕</button>
    </div>`;
  }).join('');
  const totEl = document.getElementById('sp-total');
  totEl.textContent = fmt(total);
  totEl.className = 'sp-total ' + (total<0?'neg-text':total>0?'pos-text':'');
}

function addSubEntry(){
  const date = document.getElementById('sp-date').value;
  const desc = document.getElementById('sp-desc').value.trim();
  const amount = document.getElementById('sp-amount').value;
  if (!amount || amount === '') return;

  const item = findItemFull(_sp.itemId, _sp.type, _sp.catId);
  if (!item) return;
  if (!item.subs) item.subs = newSubs();
  if (!item.subs[_sp.mi]) item.subs[_sp.mi] = [];

  item.subs[_sp.mi].push({id:uid(), date, desc, amount:parseFloat(amount)||0});
  item.v[_sp.mi] = 0; // direct value yields to subs

  document.getElementById('sp-desc').value = '';
  document.getElementById('sp-amount').value = '';
  document.getElementById('sp-amount').focus();

  renderSubsList(item.subs[_sp.mi]);
  updateCalcFast(_sp.itemId, _sp.type, _sp.catId, _sp.mi);
}

function delSubEntry(entryId){
  const item = findItemFull(_sp.itemId, _sp.type, _sp.catId);
  if (!item || !item.subs || !item.subs[_sp.mi]) return;
  item.subs[_sp.mi] = item.subs[_sp.mi].filter(e=>e.id!==entryId);
  renderSubsList(item.subs[_sp.mi]);
  updateCalcFast(_sp.itemId, _sp.type, _sp.catId, _sp.mi);
}

// Press Enter in amount field to add
document.getElementById('sp-amount').addEventListener('keydown', e => {
  if (e.key === 'Enter') addSubEntry();
});

// ================================================
// FAST CELL UPDATE (after sub-entry change)
// ================================================
function updateCalcFast(itemId, type, catId, mi) {
  const item = findItemFull(itemId, type, catId);
  if (!item) return;
  const v = getVal(item, mi);
  // Update the cell input in the table
  const tr = document.querySelector(`[data-id="${itemId}"]`);
  if (tr) {
    const tds = tr.querySelectorAll('.cell-td');
    if (tds[mi]) {
      const inp = tds[mi].querySelector('.cell-inp');
      const btn = tds[mi].querySelector('.cell-sub-btn');
      const subs = item.subs && item.subs[mi] ? item.subs[mi] : [];
      if (inp) {
        inp.value = v !== 0 ? v : '';
        inp.className = 'cell-inp ' + (v<0?'neg':v>0?'pos':'');
        inp.readOnly = subs.length > 0;
      }
      if (btn) {
        btn.className = subs.length > 0 ? 'cell-sub-btn has-subs' : 'cell-sub-btn';
        btn.textContent = subs.length > 0 ? '🧾' : '+';
        btn.title = subs.length > 0 ? `${subs.length} bon(nen) — klik om te bekijken` : 'Bon toevoegen';
      }
    }
  }
  updateCalc();
}

// ================================================
// UPDATE SUMMARY ROWS
// ================================================
function updateCalc(){
  MONTHS.forEach((_,mi)=>{
    const m=mutaties(mi),s=saldo(mi),l=liquiditeit(mi);
    const me=document.getElementById('m'+mi);
    const se=document.getElementById('s'+mi);
    const le=document.getElementById('l'+mi);
    if(me){me.textContent=fmt(m);me.className=`col-mo num ${m<0?'neg-text':m>0?'pos-text':''}`;}
    if(se) se.textContent=fmt(s);

  const c=S.cats.find(x=>x.id===catId);

  const it=findItemFull(id,type,catId);
  if(it){ it.name=val; saveToStorage(); }
}
function updBank(id,val){
  const a=S.bank.find(x=>x.id===id);

function addBank(){ S.bank.push({id:uid(),name:'Nieuwe rekening',val:0}); renderPrognose(); saveToStorage(); }

  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{ S=migrate(JSON.parse(e.target.result)); saveToStorage(); renderPrognose(); showTab('prognose',document.querySelector('.tab-btn')); showToast('✅ Gegevens geladen'); }
    catch(err){ alert('Fout bij laden: '+err.message); }
  };
  reader.readAsText(file); event.target.value='';
}

  const pw=document.getElementById('login-pw').value;
  const err=document.getElementById('login-err');
  if(!email||!pw){err.textContent='Vul e-mailadres en wachtwoord in.';return;}
  document.getElementById('login-btn').textContent='Even wachten...';
  document.getElementById('login-btn').disabled=true;
  try{
    let res;
    if(_isSignup){
      res=await _sb.auth.signUp({email,password:pw});
    } else {
      res=await _sb.auth.signInWithPassword({email,password:pw});
    }
    if(res.error) throw res.error;
    await initAfterLogin();
  } catch(e){
    err.textContent=_isSignup?'Aanmelden mislukt: '+e.message:'Inloggen mislukt: controleer e-mailadres en wachtwoord.';
    document.getElementById('login-btn').textContent=_isSignup?'Account aanmaken':'Inloggen';
    document.getElementById('login-btn').disabled=false;
  }
}

async function doLogout(){
  if(!confirm('Wil je uitloggen?')) return;
  await _sb.auth.signOut();
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('login-btn').textContent='Inloggen';
  document.getElementById('login-btn').disabled=false;
  document.getElementById('login-email').value='';
  document.getElementById('login-pw').value='';
  document.getElementById('login-err').textContent='';
}

async function initAfterLogin(){
  document.getElementById('login-screen').classList.add('hidden');
  setSyncDot('⏳');
  const loaded=await loadFromSupabase();
  if(!loaded){ loadFromStorage(); }
  renderPrognose();
  showToast(loaded?'☁️ Gegevens gesynchroniseerd':'📱 Lokale gegevens geladen');
  setSyncDot('✅');
}

function setSyncDot(icon){ const el=document.getElementById('sync-dot'); if(el) el.textContent=icon; }

async function saveToSupabase(){
  try{
    setSyncDot('🔄');
    const {error}=await _sb.from('app_data').upsert({id:'main',data:S,updated_at:new Date().toISOString()});
    setSyncDot(error?'⚠️':'✅');
  } catch(e){ setSyncDot('⚠️'); }
}

async function loadFromSupabase(){
  try{
    const {data,error}=await _sb.from('app_data').select('data').eq('id','main').single();
    if(data&&data.data){ S=migrate(data.data); saveToLocalOnly(); return true; }
  } catch(e){}
  return false;
}

// ================================================
const STORAGE_KEY='zeko-finapp-v2';
function saveToLocalOnly(){ try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(S)); }catch(e){} }
function saveToStorage(){ saveToLocalOnly(); clearTimeout(_saveTimer); _saveTimer=setTimeout(saveToSupabase,1500); }
function loadFromStorage(){ try{ const r=localStorage.getItem(STORAGE_KEY); if(r){ S=migrate(JSON.parse(r)); return true; } }catch(e){} return false; }

function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E3A5F;color:#fff;padding:8px 18px;border-radius:20px;font-size:.78rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._t); t._t=setTimeout(()=>{ t.style.opacity='0'; },2200);
}

// ================================================
// INIT
// ================================================
_sb.auth.getSession().then(({data:{session}})=>{
  if(session){
    initAfterLogin();
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
  }
});
</script>
